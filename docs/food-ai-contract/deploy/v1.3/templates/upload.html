{% extends "base.html" %}
{% block content %}
<div class="upload-container">
    <h2>上传饭店评测</h2>
    <form class="upload-form" id="uploadForm">
        <div class="form-group">
            <label for="restaurantName">店名 <span class="required">*</span></label>
            <div class="autocomplete-wrapper">
                <input type="text" id="restaurantName" placeholder="输入店名，支持模糊匹配..." autocomplete="off" required>
                <input type="hidden" id="restaurantId" value="">
                <div class="autocomplete-dropdown" id="autocompleteList"></div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="tasteScore">味道分 <span class="required">*</span> (0.1-5)</label>
                <input type="number" id="tasteScore" min="0.1" max="5" step="0.0001" required>
            </div>
            <div class="form-group half">
                <label for="valueScore">性价比分 <span class="required">*</span> (0.1-5)</label>
                <input type="number" id="valueScore" min="0.1" max="5" step="0.0001" required>
            </div>
        </div>

        <div class="form-group">
            <label for="locationSelect">位置 <span class="required">*</span></label>
            <div class="select-row">
                <div class="tree-select-wrapper loc-select-wrapper">
                    <div class="tree-trigger" id="locationTrigger">
                        <span class="tree-trigger-text" id="locationTriggerText">点击选择位置区域</span>
                        <span class="tree-trigger-arrow">▼</span>
                    </div>
                    <div class="tree-dropdown" id="locationTreeDropdown"></div>
                </div>
                <input type="hidden" id="locationSelect" value="">
                <button type="button" class="btn-sm" id="newLocationBtn">+ 新建位置</button>
            </div>
            <div class="location-locked" id="locationLocked" style="display:none">
                <span class="locked-text" id="lockedLocationText"></span>
            </div>
            <div class="location-locked" id="locationLocked" style="display:none">
                <span class="locked-text" id="lockedLocationText"></span>
            </div>
            <div class="new-location-row" id="newLocationRow" style="display:none">
                <div class="autocomplete-wrapper" style="flex:1;min-width:140px">
                    <input type="text" id="newLocationName" placeholder="输入完整位置路径（如 中国/吉林省/长春市/朝阳区），已存在则直接选用" style="width:100%">
                    <div class="autocomplete-dropdown" id="newLocationMatches"></div>
                </div>
                <div class="tree-select-wrapper">
                    <div class="tree-trigger" id="newLocationParentTrigger">
                        <span class="tree-trigger-text">点击选择父级位置</span>
                        <span class="tree-trigger-arrow">▼</span>
                    </div>
                    <div class="tree-dropdown" id="treeDropdown"></div>
                </div>
                <input type="hidden" id="newLocationParentId" value="">
                <button type="button" class="btn-sm btn-primary" id="addLocationBtn">暂存</button>
                <div class="new-location-hint" id="newLocationHint" style="width:100%;color:#999;font-size:12px"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="comment">评价 <span class="required">*</span></label>
            <textarea id="comment" rows="5" placeholder="写下你的评价..." required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="自动生成">
            </div>
            <div class="form-group half">
                <label for="reviewDate">评价日期</label>
                <input type="date" id="reviewDate">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="password">评价密钥（用于后续修改，仅限数字+字母）</label>
                <input type="text" id="password" placeholder="可不填，填后支持修改" pattern="[a-zA-Z0-9]+">
            </div>
            <div class="form-group half" style="justify-content:flex-end">
            </div>
        </div>

        <div class="form-group">
            <label>标签（可选，输入后回车添加）</label>
            <div class="tag-input-wrapper">
                <div class="tag-list" id="tagList"></div>
                <input type="text" id="tagInput" placeholder="输入标签名，回车添加..." autocomplete="off">
                <div class="autocomplete-dropdown" id="tagAutocomplete"></div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary btn-lg">提交评测</button>
        </div>
    </form>
    <div class="toast" id="toast"></div>
</div>
<script src="{{ url_for('static', filename='js/location-path.js') }}"></script>
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
